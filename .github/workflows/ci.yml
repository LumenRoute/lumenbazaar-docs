name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  malware-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout submitted commit without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Scan for known malware indicators
        run: node scripts/security/scan-malware.mjs

  docs:
    needs: malware-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Lint markdown
        run: npm run lint

      - name: Check links
        run: npm run links

      - name: Check generated references
        run: npm run check:generated

      - name: Check content quality
        run: npm run check:content

      - name: Check documentation consistency
        run: npm run check:consistency

      - name: Build site
        run: npm run build
